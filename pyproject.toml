[project]
name = "inference-gateway"
version = "0.1.1"
description = "Local gateway that drops unused context before Codex requests reach OpenAI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mahmoud Chaer" }]
keywords = ["codex", "proxy", "inference", "llm", "token-optimization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Tools",
]
dependencies = [
  "certifi>=2026.7.22",
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "uvicorn>=0.53.0",
  "websockets>=17.1",
]

[project.scripts]
inference-gateway = "inference_gateway.__main__:main"

[project.urls]
Homepage = "https://github.com/mahmoudchaer/Inference-Gateway"
Documentation = "https://github.com/mahmoudchaer/Inference-Gateway#readme"
Issues = "https://github.com/mahmoudchaer/Inference-Gateway/issues"
Changelog = "https://github.com/mahmoudchaer/Inference-Gateway/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pyinstaller>=6.22.3", "ruff>=0.16.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inference_gateway = ["dashboard.html", "thresholds.json"]
